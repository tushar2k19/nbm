<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="National Bamboo Mission">
  <rect width="32" height="32" rx="7" fill="#1a4d2e"/>
  <!-- Three bamboo stalks -->
  <rect x="9" y="5" width="2.5" height="22" rx="1.25" fill="#8CC63F"/>
  <rect x="14.75" y="3" width="2.5" height="24" rx="1.25" fill="#a8d86a"/>
  <rect x="20.5" y="6" width="2.5" height="21" rx="1.25" fill="#8CC63F"/>
  <!-- Nodes -->
  <rect x="8.5" y="11" width="3.5" height="1.2" rx="0.6" fill="#fff" opacity="0.7"/>
  <rect x="8.5" y="17" width="3.5" height="1.2" rx="0.6" fill="#fff" opacity="0.7"/>
  <rect x="14.25" y="9" width="3.5" height="1.2" rx="0.6" fill="#fff" opacity="0.7"/>
  <rect x="14.25" y="15" width="3.5" height="1.2" rx="0.6" fill="#fff" opacity="0.7"/>
  <rect x="14.25" y="21" width="3.5" height="1.2" rx="0.6" fill="#fff" opacity="0.7"/>
  <rect x="20" y="12" width="3.5" height="1.2" rx="0.6" fill="#fff" opacity="0.7"/>
  <rect x="20" y="18" width="3.5" height="1.2" rx="0.6" fill="#fff" opacity="0.7"/>
  <!-- Leaves -->
  <ellipse cx="7" cy="9" rx="4" ry="2" fill="#6db33f" transform="rotate(-35 7 9)"/>
  <ellipse cx="19" cy="8" rx="3.5" ry="1.8" fill="#6db33f" transform="rotate(30 19 8)"/>
  <ellipse cx="24" cy="14" rx="3" ry="1.5" fill="#6db33f" transform="rotate(20 24 14)"/>
</svg>
